<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
:root{--font-d:'Fraunces','Noto Serif',Georgia,serif;--font-b:'Nunito','Noto Serif',sans-serif;--font-cyr:'Noto Serif',Georgia,serif;}
/* Ćirilica — koristi Noto Serif za lijep render pravoslavnog teksta */
@font-face{font-family:'CyrDisplay';src:local('Noto Serif'),local('Georgia');unicode-range:U+0400-04FF,U+0500-052F,U+2DE0-2DFF,U+A640-A69F;}
body[data-theme="light"]{
--bg:#F5F0E4;--bgGrad:linear-gradient(180deg,#F5F0E4 0%,#EBEEDF 50%,#E0EAD8 100%);
--bgCard:rgba(255,255,255,.55);--surface:rgba(255,255,255,.5);--surfaceL:rgba(181,207,160,.25);--bgHover:rgba(255,255,255,.75);
--text:#3D5938;--textM:#5D7656;--textD:#7A8B73;
--accent:#7BA577;--accentD:#5C8B5A;--warm:#E8C796;--warmD:#D4A569;
--danger:#D4736A;--good:#7BA577;--mid:#E8C796;
--cardBorder:rgba(181,207,160,.25);--cardShadow:0 4px 16px rgba(107,135,101,.08);
--scrollThumb:rgba(122,139,115,.3);
}
body[data-theme="dark"]{
--bg:#1B2924;--bgGrad:linear-gradient(180deg,#1B2924 0%,#1F2E26 50%,#243329 100%);
--bgCard:rgba(255,255,255,.05);--surface:rgba(255,255,255,.05);--surfaceL:rgba(181,207,160,.12);--bgHover:rgba(255,255,255,.08);
--text:#E8EDD9;--textM:#BDD0AC;--textD:#9DB591;
--accent:#95C088;--accentD:#B5CFA0;--warm:#F5D88B;--warmD:#E8C796;
--danger:#E89B92;--good:#A8D199;--mid:#F5D88B;
--cardBorder:rgba(181,207,160,.15);--cardShadow:none;
--scrollThumb:rgba(157,181,145,.3);
}
html,body,#root{height:100%;color:var(--text);font-family:var(--font-b);transition:color .4s ease}
body{background:var(--bgGrad);background-attachment:fixed;overscroll-behavior:none;transition:background .4s ease}
::-webkit-scrollbar{width:4px}::-webkit-scrollbar-thumb{background:var(--scrollThumb);border-radius:2px}
input,textarea,button{font-family:inherit}
input::placeholder,textarea::placeholder{color:var(--textD)}
textarea{resize:vertical}
input[type=range]{height:4px;-webkit-appearance:none;appearance:none;background:var(--surfaceL);border-radius:2px;outline:none;cursor:pointer}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:18px;height:18px;border-radius:50%;background:var(--accent);border:2px solid var(--bg);cursor:pointer}

/* Install banner */
.install-banner{position:fixed;bottom:20px;left:20px;right:20px;padding:16px 20px;background:var(--bgCard);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid var(--cardBorder);border-radius:20px;display:flex;align-items:center;justify-content:space-between;gap:12px;z-index:100;animation:slideUp .4s ease;box-shadow:var(--cardShadow)}
.install-banner button{padding:8px 18px;border-radius:20px;border:none;cursor:pointer;font-size:13px;font-weight:600}
.install-btn{background:var(--accent);color:#fff}
.dismiss-btn{background:transparent;color:var(--textM)}
@keyframes slideUp{from{transform:translateY(80px);opacity:0}to{transform:translateY(0);opacity:1}}

/* Page container */
.page{max-width:440px;margin:0 auto;padding:env(safe-area-inset-top,20px) 20px 40px;min-height:100vh;position:relative;z-index:1}

/* Shared */
.back-btn{background:none;border:none;color:var(--textM);font-size:14px;cursor:pointer;padding:4px 0;font-family:inherit}
.primary-btn{padding:14px 32px;border-radius:28px;border:none;background:var(--accent);color:#fff;font-size:15px;font-weight:600;cursor:pointer;transition:all .25s;box-shadow:0 2px 8px rgba(123,165,119,.25)}
.primary-btn:hover{transform:translateY(-1px);box-shadow:0 4px 12px rgba(123,165,119,.35)}
.primary-btn:active{transform:translateY(0);opacity:.85}
.secondary-btn{padding:14px 32px;border-radius:28px;border:1px solid var(--cardBorder);background:var(--bgCard);color:var(--text);font-size:15px;font-weight:600;cursor:pointer;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.pill{padding:6px 14px;border-radius:20px;border:none;font-size:12px;cursor:pointer;transition:all .2s;font-family:inherit;font-weight:500}
.card{padding:16px 20px;background:var(--bgCard);border-radius:18px;border:1px solid var(--cardBorder);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--cardShadow);transition:all .3s}
.section-label{font-size:11px;color:var(--textD);text-transform:uppercase;letter-spacing:2px;margin-bottom:12px;font-weight:600}
.h2{margin:0;color:var(--text);font-family:var(--font-d);font-weight:400;font-size:28px;text-align:center;letter-spacing:0.3px}

/* Dot animation */
.dots{animation:pulse 1.2s infinite}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:1}}

/* Breathe circle */
/* Breath orb — multi-layered animated breathing visual */
.breath-orb-wrap{position:relative;width:240px;height:240px;display:flex;align-items:center;justify-content:center}
.breath-orb-glow{position:absolute;inset:-20px;border-radius:50%;filter:blur(24px);opacity:.55;transition:all 1s cubic-bezier(.4,0,.2,1)}
.breath-orb-glow.slow{transition-duration:6s}
.breath-orb-ring{position:absolute;inset:0;border-radius:50%;border:1.5px solid;opacity:.4;animation:orb-rotate 18s linear infinite}
.breath-orb-ring-2{position:absolute;inset:14px;border-radius:50%;border:1px solid;opacity:.3;animation:orb-rotate 24s linear infinite reverse}
.breath-orb-core{position:relative;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 1s cubic-bezier(.4,0,.2,1);background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.15) 0%,transparent 60%)}
.breath-orb-core.slow{transition-duration:6s}
.breath-orb-core.idle{transition-duration:.4s}
@keyframes orb-rotate{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}
@keyframes orb-pulse{0%,100%{opacity:.4}50%{opacity:.7}}
.breath-orb-particles{position:absolute;inset:0;border-radius:50%;pointer-events:none;overflow:hidden}
.breath-particle{position:absolute;border-radius:50%;background:currentColor;opacity:0;animation:particle-drift 3s ease-out infinite}
@keyframes particle-drift{0%{transform:translate(0,0) scale(.5);opacity:0}30%{opacity:.6}100%{transform:translate(var(--dx,0),var(--dy,0)) scale(1.2);opacity:0}}

/* Respect motion preferences — disable decorative animations */
@media (prefers-reduced-motion: reduce){
  .breath-orb-ring,.breath-orb-ring-2,.anim-moon,.anim-sun,.anim-tree-1,.anim-tree-2,.anim-tree-3,.anim-cloud,.anim-cloud-2,.anim-star,.anim-star-2,.anim-star-3{animation:none !important}
  .breath-orb-glow,.breath-orb-core{transition-duration:.4s !important}
}

/* CBT progress orb — circular SVG with gentle fill animation */
.progress-orb-wrap{display:flex;align-items:center;gap:12px}
.progress-orb-svg{width:36px;height:36px;flex-shrink:0}
.progress-orb-track{fill:none;stroke:var(--surfaceL);stroke-width:3}
.progress-orb-fill{fill:none;stroke-width:3;stroke-linecap:round;transform:rotate(-90deg);transform-origin:center;transition:stroke-dasharray .6s cubic-bezier(.4,0,.2,1)}
.progress-orb-pulse{animation:progress-pulse 2.4s ease-in-out infinite}
@keyframes progress-pulse{0%,100%{opacity:1}50%{opacity:.6}}
@media (prefers-reduced-motion: reduce){
  .progress-orb-pulse{animation:none}
}

/* NSDR / Body Scan silhouette */
.body-silhouette{position:relative;width:80px;height:200px;flex-shrink:0;margin:0 auto}
.body-silhouette svg{width:100%;height:100%;overflow:visible}
.body-region{transition:fill .8s ease,filter .8s ease,opacity .8s ease;fill:var(--surfaceL);opacity:.5}
.body-region.active{fill:var(--accent);opacity:.85;filter:drop-shadow(0 0 10px var(--accent))}
.body-region.glow{animation:body-pulse 3s ease-in-out infinite}
@keyframes body-pulse{0%,100%{opacity:.85}50%{opacity:1;filter:drop-shadow(0 0 16px var(--accent))}}
@media (prefers-reduced-motion: reduce){
  .body-region{transition-duration:.3s}
  .body-region.glow{animation:none}
}

/* Soundscape visualizers */
.sound-viz{position:relative;height:60px;border-radius:12px;overflow:hidden;margin-top:10px;background:var(--surface);border:1px solid var(--surfaceL)}
.sound-viz svg{width:100%;height:100%;display:block}
@keyframes rain-fall{0%{transform:translateY(-10px);opacity:0}20%{opacity:.7}100%{transform:translateY(80px);opacity:0}}
.rain-drop{animation:rain-fall 1.4s linear infinite}
@keyframes wave-roll{0%,100%{transform:translateX(0)}50%{transform:translateX(-20px)}}
.wave-line{animation:wave-roll 4s ease-in-out infinite}
@keyframes wind-drift{0%{transform:translateX(-30px);opacity:0}30%{opacity:.6}100%{transform:translateX(360px);opacity:0}}
.wind-wisp{animation:wind-drift 6s ease-in-out infinite}
@keyframes drone-pulse{0%,100%{r:10;opacity:.5}50%{r:18;opacity:.3}}
.drone-pulse{animation:drone-pulse 4s ease-in-out infinite}
@keyframes binaural-l{0%,100%{r:6;opacity:.7}50%{r:9;opacity:1}}
@keyframes binaural-r{0%,100%{r:6;opacity:.7}45%{r:9;opacity:1}}
.binaural-l{animation:binaural-l 1.8s ease-in-out infinite}
.binaural-r{animation:binaural-r 1.85s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){
  .rain-drop,.wave-line,.wind-wisp,.drone-pulse,.binaural-l,.binaural-r{animation:none !important}
}

/* Micro-moments — small celebrations and breaths of life */
/* Logo subtle wink/bounce every ~30s */
@keyframes logo-blink{0%,93%,100%{transform:scale(1)}96%{transform:scale(.96) translateY(2px)}}
.logo-alive{animation:logo-blink 32s ease-in-out infinite}
/* Step completion glow flash */
@keyframes complete-glow{0%{box-shadow:0 0 0 0 rgba(123,165,119,0)}50%{box-shadow:0 0 30px 8px rgba(123,165,119,.4)}100%{box-shadow:0 0 0 0 rgba(123,165,119,0)}}
.complete-glow{animation:complete-glow 1.4s ease-out}
/* Soft confetti for streak milestones */
@keyframes confetti-fall{0%{transform:translateY(-20px) rotate(0deg);opacity:0}10%{opacity:1}100%{transform:translateY(120px) rotate(540deg);opacity:0}}
.confetti-piece{position:absolute;width:6px;height:6px;border-radius:1px;animation:confetti-fall 2.5s ease-out forwards;pointer-events:none}
@media (prefers-reduced-motion: reduce){
  .logo-alive,.complete-glow{animation:none !important}
}

/* Old breathe-circle kept for backwards compat but unused */
.breathe-circle{border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;transition:all 1s cubic-bezier(.4,0,.2,1)}
.breathe-circle.slow{transition-duration:6s}

/* Grid */
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.action-card{padding:16px 10px;background:var(--bgCard);border:1px solid var(--cardBorder);border-radius:18px;cursor:pointer;text-align:center;transition:all .3s;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:var(--cardShadow)}
.action-card:hover{transform:translateY(-2px);background:var(--bgHover)}
.action-card:active{transform:translateY(0);background:var(--bgHover)}

/* Top bar */
.top-bar{display:flex;justify-content:space-between;align-items:center;padding:10px 20px;max-width:440px;margin:0 auto;position:relative;z-index:10}
.brand-top{font-size:10px;color:var(--accentD);font-weight:600;letter-spacing:1.5px}
.toggle-group{display:flex;gap:8px;align-items:center}
.lang-toggle,.theme-toggle{display:flex;gap:2px;background:var(--bgCard);border:1px solid var(--cardBorder);border-radius:14px;padding:3px;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.lang-btn,.theme-btn{padding:4px 10px;border-radius:11px;border:none;font-size:11px;font-weight:600;cursor:pointer;transition:all .25s;background:transparent;color:var(--textD);font-family:inherit}
.lang-btn.active{background:var(--accent);color:#fff}
.theme-btn{padding:4px 8px;font-size:13px;line-height:1}
.theme-btn.active{background:var(--accent);color:#fff}

/* Animated scenes */
.scene-bg{position:fixed;top:0;left:0;right:0;height:200px;pointer-events:none;z-index:0;overflow:hidden;opacity:.85;mask-image:linear-gradient(180deg,#000 0%,#000 60%,transparent 100%);-webkit-mask-image:linear-gradient(180deg,#000 0%,#000 60%,transparent 100%)}
.scene-bg svg{width:100%;height:100%;display:block}
@keyframes float-y{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes sway{0%,100%{transform:rotate(-1.5deg)}50%{transform:rotate(1.5deg)}}
@keyframes drift{0%{transform:translateX(-30px)}100%{transform:translateX(440px)}}
@keyframes twinkle{0%,100%{opacity:.4}50%{opacity:1}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.anim-moon{animation:float-y 6s ease-in-out infinite;transform-origin:center}
.anim-sun{animation:float-y 7s ease-in-out infinite;transform-origin:center}
.anim-tree-1{animation:sway 5.5s ease-in-out infinite;transform-origin:bottom center}
.anim-tree-2{animation:sway 6.5s ease-in-out infinite -2s;transform-origin:bottom center}
.anim-tree-3{animation:sway 5s ease-in-out infinite -3.5s;transform-origin:bottom center}
.anim-cloud{animation:drift 60s linear infinite}
.anim-cloud-2{animation:drift 75s linear infinite -25s}
.anim-star{animation:twinkle 4s ease-in-out infinite}
.anim-star-2{animation:twinkle 5s ease-in-out infinite -1.5s}
.anim-star-3{animation:twinkle 6s ease-in-out infinite -3s}
.scene-bg{animation:fadeIn .6s ease}

/* Smooth theme transition for everything */
.card,.action-card,.lang-toggle,.theme-toggle,.primary-btn,.secondary-btn{transition:background .4s ease,border-color .4s ease,color .4s ease,box-shadow .4s ease,transform .25s ease}
</style>
</head>

function scoreLabel(type,score){
  if(type==="GAD-7"){
    if(score<=4) return{text:"Minimal",c:"var(--good)"};
    if(score<=9) return{text:"Mild",c:"var(--mid)"};
    if(score<=14) return{text:"Moderate",c:"var(--warm)"};
    return{text:"Severe",c:"var(--danger)"};
  }
  if(type==="PHQ-9"){
    if(score<=4) return{text:"Minimal",c:"var(--good)"};
    if(score<=9) return{text:"Mild",c:"var(--mid)"};
    if(score<=14) return{text:"Moderate",c:"var(--warm)"};
    if(score<=19) return{text:"Mod. Severe",c:"var(--danger)"};
    return{text:"Severe",c:"var(--danger)"};
  }
  if(score<=13) return{text:"Low",c:"var(--good)"};
  if(score<=26) return{text:"Moderate",c:"var(--mid)"};
  return{text:"High",c:"var(--danger)"};
}

function TrendChart({data,max,color}){
  if(!data||data.length<2)return React.createElement('div',{style:{color:'var(--textD)',fontSize:13}},t('Not enough data'));
  const w=260,h=70,pad=10;
  const xs=i=>pad+(i/(data.length-1))*(w-2*pad);
  const ys=v=>h-pad-(v/max)*(h-2*pad);
  const pts=data.map((d,i)=>`${xs(i)},${ys(d.s)}`).join(' ');
  const area=`${xs(0)},${h-pad} ${pts} ${xs(data.length-1)},${h-pad}`;
  return React.createElement('svg',{viewBox:`0 0 ${w} ${h}`,style:{width:'100%',maxWidth:280,display:'block'}},
    React.createElement('defs',null,
      React.createElement('linearGradient',{id:`g${color.replace(/[^a-z0-9]/gi,'')}`,x1:0,y1:0,x2:0,y2:1},
        React.createElement('stop',{offset:'0%',stopColor:color,stopOpacity:.3}),
        React.createElement('stop',{offset:'100%',stopColor:color,stopOpacity:0}))),
    React.createElement('polygon',{points:area,fill:`url(#g${color.replace(/[^a-z0-9]/gi,'')})`}),
    React.createElement('polyline',{points:pts,fill:'none',stroke:color,strokeWidth:2.5,strokeLinecap:'round',strokeLinejoin:'round'}),
    ...data.map((d,i)=>React.createElement('circle',{key:i,cx:xs(i),cy:ys(d.s),r:4,fill:'var(--bg)',stroke:color,strokeWidth:2})),
    ...data.map((d,i)=>React.createElement('text',{key:'t'+i,x:xs(i),y:ys(d.s)-10,textAnchor:'middle',fill:'var(--textM)',fontSize:10,fontFamily:'inherit'},d.s))
  );
}

// SOUNDSCAPE ENGINE (Web Audio API — zero files, pure synthesis)
// ═══════════════════════════════════════════════════════════════
const AudioEngine = {
  ctx: null,
  master: null,
  nodes: {},
  
  init() {
    if (this.ctx) return;
    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
    this.master = this.ctx.createGain();
    this.master.gain.value = 0.6;
    this.master.connect(this.ctx.destination);
  },
  
  resume() { if (this.ctx?.state === 'suspended') this.ctx.resume(); },
  
  setMaster(v) { if (this.master) this.master.gain.setTargetAtTime(v, this.ctx.currentTime, 0.3); },
  
  // ── Rain: filtered white noise with gentle modulation ──
  startRain(vol = 0.5) {
    this.init(); this.stopSound('rain');
    const bufSize = 2 * this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const lp = this.ctx.createBiquadFilter();
    lp.type = 'lowpass'; lp.frequency.value = 800; lp.Q.value = 0.7;
    const hp = this.ctx.createBiquadFilter();
    hp.type = 'highpass'; hp.frequency.value = 200;
    const gain = this.ctx.createGain(); gain.gain.value = vol;
    // Gentle rain modulation
    const lfo = this.ctx.createOscillator();
    const lfoGain = this.ctx.createGain();
    lfo.frequency.value = 0.15; lfoGain.gain.value = 200;
    lfo.connect(lfoGain); lfoGain.connect(lp.frequency);
    lfo.start();
    src.connect(hp); hp.connect(lp); lp.connect(gain); gain.connect(this.master);
    src.start();
    this.nodes.rain = { src, gain, lfo, lp, hp, lfoGain };
  },
  
  // ── Ocean: layered filtered noise with slow wave rhythm ──
  startOcean(vol = 0.4) {
    this.init(); this.stopSound('ocean');
    const bufSize = 2 * this.ctx.sampleRate;
    const buf = this.ctx.createBuffer(1, bufSize, this.ctx.sampleRate);
    const data = buf.getChannelData(0);
    for (let i = 0; i < bufSize; i++) data[i] = Math.random() * 2 - 1;
    const src = this.ctx.createBufferSource();
    src.buffer = buf; src.loop = true;
    const bp = this.ctx.createBiquadFilter();
    bp.type = 'bandpass'; bp.frequency.value = 400; bp.Q.value = 0.3;

      const osc = this.ctx.createOscillator();

  // ── Binaural Beats: two sine waves with frequency offset ──
  startBinaural(vol = 0.2, type = 'theta') {
    this.init(); this.stopSound('binaural');

    const n = this.nodes[name];

  },
  
  stopSound(name) {
    const n = this.nodes[name];
    if (!n) return;
    try {
      if (n.gain) n.gain.gain.setTargetAtTime(0, this.ctx.currentTime, 0.5);
      setTimeout(() => {
        try {
          if (n.src) n.src.stop();

    } catch { delete this.nodes[name]; }
  },
  
  stopAll() { Object.keys(this.nodes).forEach(k => this.stopSound(k)); },
  
  isPlaying(name) { return !!this.nodes[name]; }
};

function App(){
  const[page,setPage]=useState('home');
  const[lang,setLang]=useState(_lang);
  const[theme,setTheme]=useState(_theme);
  const[installPrompt,setInstallPrompt]=useState(null);
  const[showBanner,setShowBanner]=useState(false);

  const switchLang=(l)=>{_lang=l;setLang(l);store.set('lang',l);};
  const switchTheme=(th)=>{_theme=th;setTheme(th);store.set('theme',th);document.body.setAttribute('data-theme',th);};

  useEffect(()=>{
    document.body.setAttribute('data-theme',theme);
    window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();setInstallPrompt(e);
      if(!localStorage.getItem('mindful_installed'))setShowBanner(true);});
  },[]);

  const install=async()=>{if(!installPrompt)return;installPrompt.prompt();
    const r=await installPrompt.userChoice;if(r.outcome==='accepted')localStorage.setItem('mindful_installed','1');
    setShowBanner(false);};

  const back=()=>setPage('home');
  return React.createElement(React.Fragment,null,
    React.createElement(Scene,{type:page==='home'?'dashboard':page,theme:theme}),
    React.createElement('div',{className:'top-bar'},
      React.createElement('span',{className:'brand-top'},'Cimesa Lab'),
      React.createElement('div',{className:'toggle-group'},
        React.createElement('div',{className:'theme-toggle'},
          React.createElement('button',{onClick:()=>switchTheme('light'),className:'theme-btn'+(theme==='light'?' active':''),title:'Light mode'},'☀'),
          React.createElement('button',{onClick:()=>switchTheme('dark'),className:'theme-btn'+(theme==='dark'?' active':''),title:'Dark mode'},'☾')),
        React.createElement('div',{className:'lang-toggle'},
          React.createElement('button',{onClick:()=>switchLang('en'),className:'lang-btn'+(lang==='en'?' active':'')},'EN'),
          React.createElement('button',{onClick:()=>switchLang('bs'),className:'lang-btn'+(lang==='bs'?' active':'')},'BS')))),
    page==='home'&&React.createElement(Dashboard,{onNav:setPage}),
    page==='breathe'&&React.createElement(Breathing,{onBack:back}),
    page==='sigh'&&React.createElement(Sigh,{onBack:back}),
    page==='bodyscan'&&React.createElement(BodyScan,{onBack:back}),
    page==='sounds'&&React.createElement(Soundscape,{onBack:back}),
    page==='cbt'&&React.createElement(CBT,{onBack:back}),
    page==='gratitude'&&React.createElement(Gratitude,{onBack:back}),
    page==='brojanica'&&React.createElement(Brojanica,{onBack:back}),
    page==='journal'&&React.createElement(Journal,{onBack:back}),
    page==='assess'&&React.createElement(Assess,{onBack:back}),
    showBanner&&React.createElement('div',{className:'install-banner'},
      React.createElement('div',null,
        React.createElement('div',{style:{color:'var(--text)',fontSize:14,fontWeight:600}},t('Install Mindful Broccoli')),

        React.createElement('button',{onClick:()=>setShowBanner(false),className:'dismiss-btn'},t('Later')),
        React.createElement('button',{onClick:install,className:'install-btn'},t('Install'))))
  );
}
